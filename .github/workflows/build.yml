name: Build

# M1: build the Android debug APK and run the desktop headless smoke test.
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android debug APK
        run: ./gradlew android:assembleDebug --stacktrace

      - name: Desktop smoke test (boots the game, exits after ~6 s)
        run: xvfb-run -a ./gradlew :desktop:run --args="--smoke"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/build/outputs/apk/debug/*.apk
