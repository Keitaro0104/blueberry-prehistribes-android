name: Build

# M1: build the Android debug APK and run the desktop headless smoke test.
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          SDK=/usr/local/lib/android/sdk
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android debug APK
        run: ./gradlew android:assembleDebug --stacktrace

      - name: Desktop smoke test (boots the game, exits after ~6 s)
        run: xvfb-run -a ./gradlew :desktop:run --args="--smoke"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/build/outputs/apk/debug/*.apk

  # The APK force-closes instantly on a real Android 16 phone and leaves
  # no log behind, so reproduce it on an Android 16 emulator and capture
  # the full logcat — that shows the real crash, Java or native.
  # NOTE: this must run on macOS. The Linux runner has no hardware CPU
  # accelerator, so its emulator never boots ("Software CPU emulation
  # (-accel off) is not supported"). macOS runners (Apple Silicon) run the
  # arm64 emulator, which also matches the real phone's ABI.
  emulator-test:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apk

      - name: Run on Android 16 emulator and capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: arm64-v8a
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r apk/android-debug.apk
            adb shell dumpsys package com.keitaro0104.blueberryprehistribes | grep -E "versionName|versionCode"
            adb shell am start -n com.keitaro0104.blueberryprehistribes/.android.AndroidLauncher || true
            sleep 20
            adb shell pidof com.keitaro0104.blueberryprehistribes && echo "APP STILL RUNNING" || echo "APP NOT RUNNING"
            adb logcat -d > logcat.txt
            echo "=== crash lines ==="
            grep -i -E "FATAL|AndroidRuntime|tombstone|fatal|SIGSEGV|SIGABRT" logcat.txt | head -n 80 || true

      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: logcat.txt
