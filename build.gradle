// Root build file — Prehistoric Tribes Android port (M1).
// Minimal hand-written Gradle setup: libGDX 1.13.5 + Kotlin 2.0, AGP 8.5.
// libGDX 1.13.5: natives are built for 16 KB page sizes (Android 16
// refuses to load the 4 KB-aligned natives from 1.12.1).
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    ext {
        gdxVersion = '1.13.5'
    }
}
